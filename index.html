    <!-- Schema.org — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é o Grupo W3?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Grupo W3 é um ecossistema empresarial fundado em 2024, especializado em aceleração e estruturação de e-commerces. Com sede em Blumenau – SC e mais de 30 profissionais, oferece soluções integradas de mentoria, tráfego pago, gestão de marketplace, pagamentos e tecnologia própria (W3 Labs)."
          }
        },
        {
          "@type": "Question",
          "name": "O que é a Mentoria AMES?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Mentoria AMES é o método de estruturação de e-commerce do Grupo W3, baseado nos mesmos pilares que levaram o Ame Kids a se tornar um dos maiores e-commerces de moda infantil do Brasil. O método foca em três pilares: Resultado (mais vendas), Eficiência (mais lucro) e Continuidade (recompra e fidelização)."
          }
        },
        {
          "@type": "Question",
          "name": "O Grupo W3 atende clientes fora de Blumenau?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Embora tenha sede física em Blumenau – SC, o Grupo W3 atende marcas em todo o Brasil. Nossa operação é nacional, com soluções que funcionam de forma remota para e-commerces de qualquer região do país."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo leva para ver resultados com o Grupo W3?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Os resultados variam de acordo com o estágio do negócio, mas nosso modelo é focado em estrutura e resultado real. Trabalhamos com metas claras, métricas definidas e acompanhamento contínuo para garantir previsibilidade e escala com margem — não apenas crescimento rápido sem sustentação."
          }
        },
        {
          "@type": "Question",
          "name": "O que diferencia o Grupo W3 de outras consultorias de e-commerce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Grupo W3 é um ecossistema integrado, não uma consultoria isolada. Temos fundadores que vivem a operação diariamente, um time interno de 30+ profissionais, tecnologia própria em desenvolvimento (W3 Labs), e todas as soluções — tráfego, marketplace, pagamentos e mentoria — funcionando de forma integrada dentro de um único sistema."
          }
        }
      ]
    }
    </script>
